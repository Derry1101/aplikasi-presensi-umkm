
services:
  backend:
    build: .
    container_name: presensi-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "mysql://root:1111@mysql:3306/presensi_db"
      JWT_SECRET: "pkm_unpam"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8.4
    container_name: presensi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1111"
      MYSQL_DATABASE: presensi_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1111"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
